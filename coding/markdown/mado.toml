# Default mado configuration for the markdown skill (see SKILL.md).
# Used only when the project has no mado.toml / .mado.toml of its own and no
# global ~/.config/mado/mado.toml exists:  mado --config <skill>/mado.toml check <files>
# Rules follow markdownlint: https://github.com/markdownlint/markdownlint/blob/main/docs/RULES.md

[lint]
# Skip files listed in .ignore files.
respect-ignore = true
# Read .gitignore only inside a Git repository: "never" | "repository-only" | "always".
respect-gitignore = "repository-only"
# One line per violation: easy for an agent to read and fix.
output-format = "concise"
# Keep the summary line so "no problems" is visible.
quiet = false
# Glob patterns never linted.
exclude = []
# Every rule mado supports.
rules = [
  "MD001",
  "MD002",
  "MD003",
  "MD004",
  "MD005",
  "MD006",
  "MD007",
  "MD009",
  "MD010",
  "MD012",
  "MD013",
  "MD014",
  "MD018",
  "MD019",
  "MD020",
  "MD021",
  "MD022",
  "MD023",
  "MD024",
  "MD025",
  "MD026",
  "MD027",
  "MD028",
  "MD029",
  "MD030",
  "MD031",
  "MD032",
  "MD033",
  "MD034",
  "MD035",
  "MD036",
  "MD037",
  "MD038",
  "MD039",
  "MD040",
  "MD041",
  "MD046",
  "MD047",
]

# MD002 / MD025 / MD041: the top-level heading is "#".
[lint.md002]
level = 1

[lint.md025]
level = 1

[lint.md041]
level = 1

# MD003: heading style (ATX "#", setext, ...) consistent within a file.
[lint.md003]
style = "consistent"

# MD004: bullet marker ("-", "*", "+") consistent within a file.
[lint.md004]
style = "consistent"

# MD007: nested bullets indented by 2 spaces.
[lint.md007]
indent = 2

# MD013: prose lines at most 80 characters; code blocks and tables exempt.
[lint.md013]
line-length = 80
code-blocks = false
tables = false

# MD024: the same heading text is allowed under different parents.
[lint.md024]
allow-different-nesting = true

# MD026: headings do not end with these characters.
[lint.md026]
punctuation = ".,;:!?"

# MD029: ordered lists numbered 1, 2, 3 ... ("one" would force all "1.").
[lint.md029]
style = "ordered"

# MD030: one space after a list marker.
[lint.md030]
ul-single = 1
ol-single = 1
ul-multi = 1
ol-multi = 1

# MD033: no inline HTML elements allowed.
[lint.md033]
allowed-elements = []

# MD035: horizontal rule style consistent within a file.
[lint.md035]
style = "consistent"

# MD036: emphasis used as a heading may not end with these characters.
[lint.md036]
punctuation = ".,;:!?"

# MD046: code blocks are fenced (```), not indented.
[lint.md046]
style = "fenced"
